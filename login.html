<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f7f6; }
        form { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); width: 300px; text-align: center; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #010101; color: white; border: none; padding: 10px 15px; width: 100%; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #fcfcfc;
        color: #010101; }
    </style>
</head>
<body>

   
    <form action="index.html">
        <h2>Iniciar Sesión</h2>
        
        
        <input type="email" placeholder="Correo (ej: usuario@gmail.com)"  required >
    
        <input type="password" placeholder="Contraseña (mín. 6 caracteres)" minlength="6" required>
        
        <button type="submit">Entrar</button>
    </form>

</body>
</html>
